[project]
name = "my-split-v3-backend"
version = "0.1.0"
description = "vLLM attention backend with chunked-prefill-capable Triton kernel (Qwen3-0.6B demo, v3)"
requires-python = ">=3.10"
dependencies = [
    "vllm==0.19.1",
    "triton>=3.0",
    "torch",
]

[project.entry-points."vllm.general_plugins"]
my_split_v3_backend = "triton_attention_backend:register"

[tool.setuptools]
py-modules = ["triton_attn", "triton_attention_backend"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
