[project]
name = "my-flexattn-backend"
version = "0.1.0"
description = "vLLM AttentionBackend plugin — FlexAttention-backed attention (educational, sibling of vllm_attn/flashinfer and vllm_attn/flashattn)"
requires-python = ">=3.10"
dependencies = [
    "vllm==0.19.1",
    "torch>=2.5",
]

[project.entry-points."vllm.general_plugins"]
my_flexattn_backend = "flex_attn_attention_backend:register"

[tool.setuptools]
py-modules = ["flex_attn_attention_backend"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
